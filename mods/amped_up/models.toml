target_sha256 = "b41470704489b3741e09e430e08c5153e750c14852aab77fe657de9d1a630a5a"
target_crc32 = "711f70f4"

[segment]
rom_start = "0xE00000"
ram_start = "0x80400000"
length = "0x32E3B0"

[retail_memory]
heap_pool_end = "0x80242F00"
static_noload_end = "0x803FFDB0"
