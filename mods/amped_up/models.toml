[[tables]]
name = "animations"
ram_address = "0x805A5400"
# Idle, left/right steering, podium and effect states selected by 805A6D30.
# The table ends at 805A5488, where the first Animation structure begins.
entries = 34

[[raw_racer_colour_records]]
ram_address = "0x805ADAC8"
entries = 8
stride = 6
fields = 3

# The stock character selector starts at row 2 (marker 0), the normal set.
# Z cycles the descriptor at 0x805A5D08 to other authored variants. For each
# racer, the selected loader row DMA-copies ROM [rom_start, rom_end) to ram_address, then scans
# each 8-byte record and rebases G_DL/G_SETTIMG pointers into that source range.
# The nine leading 16-byte entries are model display-list selectors; offset 0x90
# is the package's shared geometry root. The reserved slot-0 packages are not
# the normal character-select defaults.
[model_package_table]
ram_address = "0x805A5D88"
row_stride = 16
rows_per_character = 8
entry_stride = 16
selected_slot = 2
expected_marker = "0x00000000"

