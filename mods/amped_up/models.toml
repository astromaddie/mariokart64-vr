# The custom renderer also selects static display-list roots from these four
# eight-entry tables. They cover the character-specific near/far LOD lists and
# the package's alternate list starts. Every root is walked below alongside the
# DMA package roots so its nested G_DL, G_VTX, and G_SETTIMG operands are fixed.
[[model_static_display_list_tables]]
name = "character_lod_far"
ram_address = "0x805A46C0"
entries = 8
