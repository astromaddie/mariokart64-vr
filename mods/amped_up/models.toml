# The stock loader's slot-0 (marker 0xFFFE0000) high-detail package for each
# racer. It DMA-copies ROM [rom_start, rom_end) to ram_address, then scans
# each 8-byte record and rebases G_DL/G_SETTIMG pointers into that source range.
# The nine leading 8-byte entries are model display-list selectors; offset 0x90
# is the package's shared geometry root. Slot-2 rows intentionally stay unused.
[model_package_table]
ram_address = "0x805A5D88"
row_stride = 16
rows_per_character = 8
expected_marker = "0xFFFE0000"

[[model_packages]]
name = "mario"
row_index = 0
ram_address = "0x805C6E10"
rom_start = "0x1529820"
rom_end = "0x152E4B0"
