# These are typed stock animation structures. Amped stores them as direct
# KSEG pointers, while the stock animation routines pass every such pointer
# through segmented_to_virtual (which indexes the full high byte). Convert
# their data fields to segment-0 offsets during private import. The game sets
# segment 0 to physical base 0 (SEG_START=0x80000000).
[[cpu_pointer_tables]]
name = "skeletons"
ram_address = "0x805A4740"
entries = 8
kind = "armature"

[[cpu_pointer_tables]]
name = "animations"
ram_address = "0x805A5400"
entries = 34
kind = "animation"

[[cpu_pointer_tables]]
name = "secondary_animation_list"
ram_address = "0x805AA6A8"
entries = 1
kind = "animation"

[[cpu_pointer_roots]]
name = "secondary_mario_armature"
ram_address = "0x805AA538"
kind = "armature"

[[cpu_pointer_roots]]
name = "secondary_mario_armature_alt"
ram_address = "0x805AA5F0"
kind = "armature"

# These four LUI words form arguments for direct calls to the stock animation
# function. Lowering the upper byte makes the resulting values segment-0
# pointers without changing any CPU-side address calculations elsewhere.
[[code_patches]]
address = "0x805A6838"
expected_word = "0x3C05805B"
replacement_word = "0x3C05005B"
purpose = "stock render_animated_model arg1: secondary animation list"

