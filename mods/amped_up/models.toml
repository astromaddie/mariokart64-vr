# 804ADE40 indexes gGfxPool->mtxEffect using gMatrixEffectCount. The retail
# pool has 660 Mtx entries; Amped's original 960 check crosses into later GfxPool
# fields, so cap this extracted helper at the verified stock allocation bound.
[[code_patches]]
address = "0x804ADE54"
expected_word = "0x286603C0"
replacement_word = "0x28660294"
purpose = "bound Amped effect matrices to the 660-entry retail mtxEffect array"

